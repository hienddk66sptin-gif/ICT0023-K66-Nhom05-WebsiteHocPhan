
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ</title>
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="lienhe.css">
</head>
<body>
    <header> 
        <div class="dau_trang">
             <img src="images/logo_TBU.png" class="logo_truong">
            <div>
                <h1>Giới thiệu các khóa học dành cho sinh viên K66 ĐHSP Tin</h1>
                 <nav> <!--Vùng chứa các liên kết điều hướng chính ở menu-->
                   <a href="trangchu.html">Trang chủ</a>
                    <a href="index.html">Học phần</a>
                    <a href="congcu.html">Công cụ</a>
                    <a href="lienhe.html">Liên hệ</a>
                    <a href="huongdanvahoidap">Hưỡng dẫn và hỏi đáp</a>
                 </nav>
            </div>
        </div>
    </header>
    <main>
        <h2>Liên hệ với chúng tôi</h2>
        <p>Nếu bạn có câu hỏi hoặc góp ý, hãy gửi thông tin qua biểu mẫu bên dưới.</p>
        <form novalidate> <!--bình thường html sẽ dựa vào các thuộc tính required và type=email để kiểm tra xem ta nhập email hay tên đúng chưa, có novalidate thì nó sẽ tắt trước cái kiểm tra tự động đó -->
            <div>
                <label for="hoten">Họ và tên</label>
                <input type="text" id="hoten" name="hoten" placeholder="Nhập họ tên của bạn" required>
                <small id="sai_hoTen"></small> <!--Small dùng để biểu diễn phần chữ phụ, có kích thước nhỏ hơn nội dung chính-->
                <small id="dung_hoTen"></small>
            </div>

            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Nhập địa chỉ email của bạn" required>
                <small id="sai_email"></small>
                <small id="dung_email"></small>
            </div>

            <div>
                <label for="noidunglienhe">Nội dung liên hệ:</label>
                <textarea id="noidunglienhe" name="noidunglienhe"
                rows="5"
                placeholder="Nhập câu hỏi hoặc góp ý của bạn" required></textarea>
                <small id="sai_noiDungLienHe"></small>
                <small id="dung_noiDungLienHe"></small>
            </div>
            <button type="submit">Gửi liên hệ</button>
            <p id="thongBaoGui"></p>
        </form>
    </main>
   <footer>
        <p>© 2026 - Website giới thiệu học phần, nhóm 5</p>
    </footer>
<script src="lienhe.js"></script>
</body>
</html>
