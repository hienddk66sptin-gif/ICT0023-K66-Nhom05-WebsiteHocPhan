<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập - Thiết kế Web</title>
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="baitap.css">
</head>
<body>
    <header>
        <div class="dau_trang">
             <img src="images/logo_TBU.png" class="logo_truong">
            <div>
        <h1>BÀI TẬP HỌC PHẦN MÔN TIẾNG ANH 3</h1>
        <a href="tienganh.html">Quay lại học phần</a>
    </header>
<main>
    <section>
            <h3>Yêu cầu</h3>
            <p>Bài làm phải được hoàn thiện vào 1 file word duy nhất.</p>
        <hr>
        <h2 class="tieu_de_nop_bai">Nộp bài tập</h2>
        <form id="form_nop_bai">
            <div>
                <label for="ghi_chu">
                    Ghi chú về bài làm:
                </label> 
                <textarea 
                    id="ghi_chu"
                    name="ghi_chu"
                    rows="4"
                    placeholder="Nhập ghi chú nếu cần..."
                ></textarea>
            </div>

            <div>
                <label for="file_bai_tap">
                    Chọn tệp bài làm:
                </label> 
                <input
                    class="nut_chon_tep"
                    type="file"
                    id="file_bai_tap"
                    name="file_bai_tap"
                    accept=".html,.css,.js,.zip,.rar,.pdf" required
                >
            </div> 
            <p id="trang_thai_nop_bai">
                Trạng thái: Chưa nộp bài.
            </p>
            <button class="nut_nop_bai_o_cuoi" type="submit">Nộp bài</button> 
        </form>
    </section>
</main>
    <footer>
        <p>© 2026 - Website giới thiệu học phần, nhóm 5</p>
    </footer>
        <script src="nopbaitap.js"> </script>
</body>
</html>
